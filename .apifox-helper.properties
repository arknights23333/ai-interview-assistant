# 根据 Javadoc 的 @folder 标签设置接口所属文件夹。
folder.name=#folder

# 忽略 Javadoc 中带有 @ignore 标签的类或方法。
ignore=#ignore
# 登录身份由 Spring Security 注入，不作为客户端请求参数导出。
param.ignore=groovy:it.hasAnn("org.springframework.security.core.annotation.AuthenticationPrincipal") || it.type().name() == "com.assistant.aiinterviewassistant.common.domain.dto.PageQuery"

# PageQuery 由 Spring 绑定。导出时将页码和每页条数声明为 URL 查询参数。
method.additional.param[groovy:it.args().any{arg->arg.type().name().equals("com.assistant.aiinterviewassistant.common.domain.dto.PageQuery")}]={"name":"pageNum","value":"1","description":"页码，从 1 开始","required":false}
method.additional.param[groovy:it.args().any{arg->arg.type().name().equals("com.assistant.aiinterviewassistant.common.domain.dto.PageQuery")}]={"name":"pageSize","value":"10","description":"每页条数，最多 100 条","required":false}

# 将源码中声明的可空字段导出为允许 null 的数据模型字段。
field.schema.permit.null=@org.jspecify.annotations.Nullable
