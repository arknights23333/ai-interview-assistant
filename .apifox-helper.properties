# 根据 Javadoc 的 @folder 标签设置接口所属文件夹。
folder.name=#folder

# 忽略 Javadoc 中带有 @ignore 标签的类或方法。
ignore=#ignore
# 登录身份由 Spring Security 注入，不作为客户端请求参数导出。
param.ignore=groovy:it.hasAnn("org.springframework.security.core.annotation.AuthenticationPrincipal")

# 将源码中声明的可空字段导出为允许 null 的数据模型字段。
field.schema.permit.null=@org.jspecify.annotations.Nullable
